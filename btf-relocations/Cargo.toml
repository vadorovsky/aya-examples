[workspace]
resolver = "2"
members = [
    "btf-relocations",
    "btf-relocations-common",
    "btf-relocations-ebpf",
]
default-members = ["btf-relocations", "btf-relocations-common"]

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace.dependencies]
aya = { path = "../../aya/aya", default-features = false }
aya-build = { path = "../../aya/aya-build", default-features = false }
aya-ebpf = { path = "../../aya/ebpf/aya-ebpf", default-features = false }
aya-log = { path = "../../aya/aya-log", default-features = false }
aya-log-ebpf = { path = "../../aya/ebpf/aya-log-ebpf", default-features = false }

anyhow = { version = "1", default-features = false }
cargo_metadata = { version = "0.23.0", default-features = false }
# `std` feature is currently required to build `clap`.
#
# See https://github.com/clap-rs/clap/blob/61f5ee5/clap_builder/src/lib.rs#L15.
clap = { version = "4.5.20", default-features = false, features = ["std"] }
env_logger = { version = "0.11.5", default-features = false }
libc = { version = "0.2.159", default-features = false }
log = { version = "0.4.22", default-features = false }
tokio = { version = "1.40.0", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.btf-relocations-ebpf]
debug = 2
codegen-units = 1
